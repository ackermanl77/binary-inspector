name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python (requires-python) and the newest one the build uses.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: |
          python -m pip install ruff==0.6.9
          python -m ruff check .
      - name: Tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and self-test
        run: .\build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: BinaryInspector
          path: dist/BinaryInspector.exe
          if-no-files-found: error

  audit:
    # Known vulnerabilities in the pinned/required Python packages (OSV / PyPI advisory data).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-build.txt --progress-spinner off
